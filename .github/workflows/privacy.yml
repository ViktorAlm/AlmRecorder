name: Repository privacy boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tracked tree and reachable history
        run: ./Scripts/check_repository_privacy.sh --history
