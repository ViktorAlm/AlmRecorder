<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">AlmRecorder ribbon A with rotated Yeti crossbar</title>
  <desc id="description">
    A balanced speech-ribbon A with a complete front-view desktop microphone
    rotated horizontally to form a short crossbar supported by the right leg.
  </desc>

  <defs>
    <mask id="mesh-cutouts">
      <path
        d="
          M537 461
          V420
          C537 386 557 365 585 365
          C613 365 633 386 633 420
          V461
          Z
        "
        fill="white"
      />
      <rect x="549" y="392" width="72" height="6" rx="3" fill="black" />
      <rect x="545" y="405" width="80" height="6" rx="3" fill="black" />
      <rect x="543" y="418" width="84" height="6" rx="3" fill="black" />
      <rect x="543" y="431" width="84" height="6" rx="3" fill="black" />
      <rect x="545" y="444" width="80" height="6" rx="3" fill="black" />
    </mask>
  </defs>

  <g shape-rendering="geometricPrecision">
    <!-- Original speech-ribbon silhouette, preserved as one continuous path. -->
    <path
      id="voice-ribbon"
      transform="translate(0 194) scale(1 .87) translate(0 -194)"
      d="
        M132 795
        H145
        C174 795 194 747 213 699
        C221 679 231 673 242 673
        C253 673 261 682 267 688
        C273 694 280 692 286 682
        C294 670 302 638 310 622
        L488 258
        C500 220 523 194 555 194
        H625
        L580 296
        L386 695
        C374 720 355 785 330 813
        C320 823 306 825 295 821
        C280 816 271 799 262 783
        L253 763
        C249 753 246 741 240 741
        C234 741 230 751 226 762
        L216 785
        C201 811 179 823 151 823
        H132
        Z
      "
      fill="#859477"
    />

    <!--
      The complete front-view microphone is rotated -90° and scaled down so
      the product silhouette itself becomes the A's short crossbar. Its broad
      base joins the right ribbon so the microphone is visibly supported.
    -->
    <g
      id="rotated-yeti-crossbar"
      transform="translate(640 614) rotate(-90) scale(.55 .43) translate(-585 -544)"
    >
      <!-- Domed mesh grille and its distinct collar. -->
      <path
        id="microphone-grille"
        d="
          M537 461
          V420
          C537 386 557 365 585 365
          C613 365 633 386 633 420
          V461
          Z
        "
        fill="#252824"
        mask="url(#mesh-cutouts)"
      />
      <rect x="529" y="452" width="112" height="18" rx="9" fill="#859477" />

      <!-- Tall body with restrained front controls. -->
      <path
        id="microphone-body"
        d="
          M538 464
          H632
          V559
          C632 581 615 598 593 598
          H577
          C555 598 538 581 538 559
          Z
        "
        fill="#252824"
      />
      <circle cx="585" cy="538" r="12" fill="#859477" />

      <!-- A single clean yoke preserves the Yeti silhouette without small hardware. -->
      <path
        d="
          M520 523
          V612
          H650
          V523
        "
        fill="none"
        stroke="#859477"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- One tapered sage pedestal extends beneath and out from the right ribbon. -->
      <path d="M550 606 H620 L630 830 H540 Z" fill="#859477" />
    </g>

    <!--
      A closed right ribbon replaces the round-capped stroke: the restrained
      crown overlaps the sage apex while the lower endpoint remains rounded.
    -->
    <path
      id="transcript-ribbon"
      transform="translate(0 194) scale(1 .87) translate(0 -194)"
      d="
        M613 194
        H625
        C641 194 650 204 657 222
        L865.4 761.3
        C876 787 874 819 850 819
        H794
        C785 819 786 815 778.6 794.7
        L580 296
        L613 194
        Z
      "
      fill="#252824"
    />
  </g>
</svg>
