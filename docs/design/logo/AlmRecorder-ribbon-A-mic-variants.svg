      />
      <rect x="482" y="570" width="18" height="36" rx="9" fill="#252824" />
      <rect x="516" y="570" width="18" height="36" rx="9" fill="#252824" />
      <rect x="550" y="570" width="18" height="36" rx="9" fill="#252824" />
