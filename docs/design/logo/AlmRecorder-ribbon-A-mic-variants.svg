      d="
        M132 778
        H168
        C192 778 208 760 220 736
        L241 695
        C251 675 269 672 283 691
        L303 718
        C317 737 343 731 351 708
        L496 264
        C506 233 532 212 565 212
        H604
      "
      fill="none"
      stroke="#859477"
      stroke-width="104"
      stroke-linecap="butt"
      stroke-linejoin="round"
    />

    <path
      id="transcript-ribbon-balanced"
      d="M604 212 L822 778"
      fill="none"
      stroke="#252824"
      stroke-width="104"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <g id="variant-solid">
      <use href="#voice-ribbon-balanced" />
      <path
        fill="#252824"
        fill-rule="evenodd"
        d="
          M472 536
          H780
          V640
          H472
          A52 52 0 0 1 472 536
          Z

          M492 568
          A10 10 0 0 1 502 578
          V598
          A10 10 0 0 1 482 598
          V578
          A10 10 0 0 1 492 568
          Z

          M528 568
          A10 10 0 0 1 538 578
          V598
          A10 10 0 0 1 518 598
          V578
          A10 10 0 0 1 528 568
          Z

          M564 568
          A10 10 0 0 1 574 578
          V598
          A10 10 0 0 1 554 598
          V578
          A10 10 0 0 1 564 568
          Z
        "
      />
      <use href="#transcript-ribbon-balanced" />
    </g>

    <g id="variant-slim">
      <use href="#voice-ribbon-balanced" />
      <path
        fill="#252824"
        fill-rule="evenodd"
        d="
          M464 556
          H776
          V620
          H464
          A32 32 0 0 1 464 556
          Z

          M490 573
          A7 7 0 0 1 497 580
          V596
          A7 7 0 0 1 483 596
          V580
          A7 7 0 0 1 490 573
          Z

          M518 573
