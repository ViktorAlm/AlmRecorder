<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1600"
  viewBox="0 0 1600 1600"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Balanced AlmRecorder ribbon A microphone variants</title>
  <desc id="description">
    Four microphone-crossbar variants of the AlmRecorder speech-ribbon A. In
    every variant, the left and right diagonal ribbons have equal visual weight.
  </desc>

  <defs>
